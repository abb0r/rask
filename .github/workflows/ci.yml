name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype6-dev libx11-dev libxcb1-dev
      - name: Test
        run: cargo test --locked

  release:
    name: Build ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            src: target/release/rask
          - os: windows-latest
            artifact: windows-x86_64.exe
            src: target/release/rask.exe
          - os: macos-latest
            artifact: macos-aarch64
            src: target/release/rask
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype6-dev libx11-dev libxcb1-dev
      - name: Build
        run: cargo build --release --locked
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.src }}" "dist/rask-${GITHUB_REF_NAME}-${{ matrix.artifact }}"
          if [[ "${RUNNER_OS}" != "Windows" ]]; then
            chmod +x dist/*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rask-${{ matrix.artifact }}
          path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
